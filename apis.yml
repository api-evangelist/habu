name: Habu
description: >-
  Habu was a data clean room and data collaboration company, founded in 2017 and
  headquartered in San Francisco, that let brands, publishers, and media platforms
  run privacy-safe joins and analytics on each other's first-party data without
  moving or exposing raw records. In January 2024 Habu was acquired by LiveRamp,
  and the product now ships as LiveRamp Clean Room within the LiveRamp data
  collaboration network. The standalone habu.com domain now 301-redirects to
  liveramp.com, and Habu's former developer surface (docs.habu.com,
  developer.habu.com) no longer resolves — the successor developer, security, and
  compliance surfaces live under liveramp.com. This profile originated as a
  portfolio-lead stub (backed by Norwest Venture Partners and Wing Venture Capital)
  and is enriched here to reflect the acquisition and the real, still-live security
  posture inherited by LiveRamp.
