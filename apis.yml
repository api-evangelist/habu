image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/habu.png
name: Habu
description: >-
  Habu was a data clean room and data collaboration company, founded in 2017 and
  headquartered in San Francisco, that let brands, publishers, and media platforms
  run privacy-safe joins and analytics on each other's first-party data without
  moving or exposing raw records. In January 2024 Habu was acquired by LiveRamp,
  and the product now ships as LiveRamp Clean Room within the LiveRamp data
  collaboration network. The habu.com marketing domain 301-redirects to
  liveramp.com and the old docs.habu.com / developer.habu.com hosts no longer
  resolve, but the product API itself is still very much alive on Habu's own
  infrastructure: api.habu.com/v1 answers today, and LiveRamp publishes its full
  151-operation OpenAPI 3.0.0 contract — titled "External APIs for Customer
  Integration", contact platform_admin@habu.com — under developers.liveramp.com.
  The console is still Habu-branded at console.habu.com. This profile originated
  as a portfolio-lead stub (backed by Norwest Venture Partners and Wing Venture
  Capital) and is enriched here from that live, publicly documented surface plus
  the security and compliance posture inherited by LiveRamp.
