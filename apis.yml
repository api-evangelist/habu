apis:
- name: Habu Clean Room API
  description: >-
    The Habu Clean Room API — published by LiveRamp as "External APIs for Customer
    Integration" and still served from Habu's own api.habu.com host — lets customers
    set up and manage clean rooms, provision data connections and datasets, invite
    partners, author and permission analytical questions, run those questions and
    flows, and retrieve or export the results, without going through the console UI.
    It is a 151-operation OpenAPI 3.0.0 contract over 108 paths, secured with an
    OAuth 2.0 client-credentials flow whose token endpoint is api.habu.com/v1/oauth/token.
  humanURL: https://developers.liveramp.com/clean-room-api
