        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Destinations

  /cleanrooms/{cleanroomId}/intelligence:
    get:
      x-internal: true
      summary: Get Habu Intelligence bindings for a Cleanroom
      operationId: getCleanroomIntelligence
      description: >-
        **Internal API — for internal LiveRamp consumption, not part of the supported external contract.**


        Resolves all Habu Intelligence (HI) referents for a Cleanroom in one call: the Snowflake
        database name, the Metabase database id, the Metabase collection id, and the
        provisioning status. Replaces the heuristic display-id prefix matching previously needed
        to map a Cleanroom to its Metabase database.

        Requires the API user to have the `HabuIntelligenceAdmin` permission in addition to
        `read:cleanrooms` scope on the API key.
      parameters:
        - name: cleanroomId
          in: path
          description: The Cleanroom ID
          schema:
            type: string
          required: true
      responses:
        '200':
          description: HI bindings for the Cleanroom
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanRoomIntelligence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Intelligence
        - Internal

  /cleanrooms/{cleanroomId}/intelligence/loaded-questions:
    get:
      x-internal: true
      summary: List Cleanroom Questions with HI data loaded
      operationId: listLoadedIntelligenceQuestions
      description: >-
        **Internal API — for internal LiveRamp consumption, not part of the supported external contract.**


        Returns the set of Cleanroom Questions whose results have been loaded into the
        Cleanroom's Habu Intelligence Snowflake database, with their Snowflake report-table
        names and Metabase table ids.

        Requires the API user to have the `HabuIntelligenceAdmin` permission in addition to
        `read:cleanrooms` scope on the API key.
      parameters:
        - name: cleanroomId
          in: path
          description: The Cleanroom ID
          schema:
            type: string
          required: true
        - name: pageSize
          in: query
          description: The page size - default 50, max 200
          schema:
            type: integer
            default: 50
            maximum: 200
          required: false
        - name: pageToken
          in: query
          description: Opaque pagination token returned by a previous call
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Loaded questions page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadedIntelligenceQuestions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Intelligence
        - Internal

  /cleanrooms/{cleanroomId}/cleanroom-questions/{cleanroomQuestionId}/intelligence:
    get:
      x-internal: true
      summary: Get HI bindings for a Cleanroom Question
      operationId: getCleanroomQuestionIntelligence
      description: >-
        **Internal API — for internal LiveRamp consumption, not part of the supported external contract.**


        Resolves the Snowflake report and metadata table names and the Metabase table ids for
        a specific Cleanroom Question, plus its load status.

        Requires the API user to have the `HabuIntelligenceAdmin` permission in addition to
        `read:cleanrooms` scope on the API key.
      parameters:
        - name: cleanroomId
          in: path
          description: The Cleanroom ID
          schema:
            type: string
          required: true
        - name: cleanroomQuestionId
          in: path
          description: The Cleanroom Question ID
          schema:
            type: string
          required: true
      responses:
        '200':
          description: CRQ HI bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanRoomQuestionIntelligence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Intelligence
        - Internal

  /cleanrooms/{cleanroomId}/flows/{flowId}/intelligence:
    get:
      x-internal: true
      summary: Resolve flow outputs to HI report tables
      operationId: getFlowIntelligence
      description: >-
        **Internal API — for internal LiveRamp consumption, not part of the supported external contract.**


        For each question output in a Cleanroom flow, returns the corresponding Snowflake report
        table and Metabase table id. Optional flowRunId enriches each output with its run status.

        Requires the API user to have the `HabuIntelligenceAdmin` permission in addition to
        `read:cleanrooms` scope on the API key.
      parameters:
        - name: cleanroomId
          in: path
          description: The Cleanroom ID
          schema:
            type: string
          required: true
        - name: flowId
          in: path
          description: The Cleanroom Flow ID
          schema:
            type: string
          required: true
        - name: flowRunId
          in: query
          description: Optional flow run ID to enrich each output with run status
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Flow HI bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowIntelligence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Intelligence
        - Internal

components:
  responses:
    BadRequest:
      description: Bad Request - Incorrect syntax or request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReturnObject'
        application/xml:
          schema:
            $ref: '#/components/schemas/ReturnObject'
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReturnObject'
        application/xml:
          schema:
            $ref: '#/components/schemas/ReturnObject'
    Unauthorized:
      description: Authorization information was missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReturnObject'
        application/xml:
          schema:
            $ref: '#/components/schemas/ReturnObject'
    Forbidden:
      description: This action is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReturnObject'
        application/xml:
          schema:
            $ref: '#/components/schemas/ReturnObject'
    ResourceConflict:
      description: Conflict with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReturnObject'
        application/xml:
          schema:
            $ref: '#/components/schemas/ReturnObject'
    PreconditionFailed:
      description: Precondition Failed - a required precondition for the request has not been met
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReturnObject'
        application/xml:
          schema:
            $ref: '#/components/schemas/ReturnObject'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReturnObject'
        application/xml:
          schema:
            $ref: '#/components/schemas/ReturnObject'
    QuestionRunStatusUpdate:
      description: Successfully sent the updated Cleanroom Question Run status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReturnObject'
        application/xml:
          schema:
            $ref: '#/components/schemas/ReturnObject'

  schemas:
    ProvisionCleanroomDestinationRequest:
      type: object
      properties:
        destinations:
          type: array
          items:
            type: string

    ProvisionCleanroomDestinationResponse:
      type: array
      items:
        $ref: '#/components/schemas/ActivationChannelProvision'

    ReviewDestinationProvisioningRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          description: Decision to approve or reject the destination provisioning request.
          enum:
            - APPROVE
            - REJECT

    ReviewDestinationProvisioningResponse:
      type: object
      properties:
        success:
          type: boolean
          description: true if the provisioning request decision was applied successfully.

    ActivationChannelProvision:
      type: object
      properties:
        timeAudit:
          $ref: '#/components/schemas/TimeAudit'
        userAudit:
          $ref: '#/components/schemas/UserAudit'
        cleanroomId:
          type: string
        partnerAccountId:
          type: string
        channelStatus:
          type: string

    ListCleanroomDestinationsResponse:
      type: object
      properties:
        partnerAccounts:
          type: array
          items:
            $ref: '#/components/schemas/CleanroomProvisionedDestination'
        total:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32

    CleanroomProvisionedDestination:
      type: object
      properties:
        partnerAccount:
          $ref: '#/components/schemas/PartnerAccount'
        ownership:
          type: string
          description: OWNER when the destination belongs to the cleanroom owner organization; PARTNER otherwise.
          enum:
            - OWNER
            - PARTNER
        channelStatus:
          type: string
          description: Provisioning Status of the this destination in the cleanroom like 'ACTIVE_CHANNEL', 'PENDING_CHANNEL'.
        isUsedForActivation:
          type: boolean
          description: Whether this partner account is tied to activation in this cleanroom.

    CreateDataExportJobRequest:
      type: object
      properties:
        cleanroomQuestionId:
          type: string
        partnerAccountIds:
          type: array
          items:
            type: string
        exportParameters:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobParameter'
        cleanroomDatasetId:
          type: string

    ExportJobParameter:
      type: object
      properties:
        name:
          type: string
        value:
          type: string

    CreateDataExportJobResponse:
      type: array
      items:
        type: string

    NodeExportRequest:
      type: object
      required:
        - nodeId
        - partnerAccountIds
      properties:
        nodeId:
          type: string
          description: The node UUID or display label to create exports for.
        partnerAccountIds:
          type: array
          items:
            type: string
          description: Partner account IDs to export to. One job is created per partner account.
        exportParameters:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobParameter'
          description: Optional export parameters (e.g. S3_EXPORT_PATH, GCS_EXPORT_PATH).

    NodeExportResult:
      type: object
      properties:
        nodeId:
          type: string
        jobIds:
          type: array
          items:
            type: string

    FlowNodeExportJob:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Display name of the export job.
        status:
          type: string
          description: Job status (ACTIVE or PAUSED).
        channelStatus:
          type: string
          description: Health status of the export channel.
        partnerAccountId:
          type: string
        partnerAccountName:
          type: string
          description: Display name of the partner account.
        createdAt:
          type: string
          format: date-time
        lastRunTime:
          type: string
          format: date-time
          description: Timestamp of the last execution of this export job.
        exportParameters:
          type: array
          description: Export parameters configured for this job (e.g. S3 path, format).
          items:
            $ref: '#/components/schemas/ExportJobParameter'

    NodeExportJobList:
      type: object
      properties:
        nodeId:
          type: string
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/FlowNodeExportJob'

    BulkNodeStatusRequest:
      type: object
      required:
        - nodeIds
        - status
      properties:
        nodeIds:
          type: array
          items:
            type: string
        status:
          type: string
          description: Target status for all jobs under these nodes (ACTIVE or PAUSED).

    NodeStatusResult:
      type: object
      properties:
        nodeId:
          type: string
        success:
          type: boolean

    BulkNodeDeleteRequest:
      type: object
      required:
        - nodeIds
      properties:
        nodeIds:
          type: array
          items:
            type: string

    NodeDeleteResult:
      type: object
      properties:
        nodeId:
          type: string
        deletedJobIds:
          type: array
          items:
            type: string

    NodeJobRunsList:
      type: object
      properties:
        nodeId:
          type: string
        jobRuns:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobRun'

    ChangeJobStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Target job status (ACTIVE or PAUSED).

    ChangeJobStatusResponse:
      type: object
      properties:
        success:
          type: boolean

    ListDataExportJobRunsResponse:
      type: object
      properties:
        organization:
          type: string
        question:
          type: string
        jobRunsByDate:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobRunByDate'
        exportDetailParameters:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobParameter'


    ExportJobRunByDate:
      type: object
      properties:
        date:
          type: string
        organization:
          type: string
        jobRuns:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobRun'

    ExportJobRun:
      type: object
      properties:
        id:
          type: string
        jobId:
          type: string
        status:
          $ref: "#/components/schemas/JobRunStatus"
        submitTime:
          type: string
          format: date-time
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalRecords:
          type: integer
        consentedRecords:
          type: integer
        cumulativeRecords:
          type: integer
        sourceJobRunID:
          type: string
        jobRunType:
          $ref: "#/components/schemas/JobRunType"
        details:
          $ref: "#/components/schemas/JobDetails"
        errorMessage:
          type: string

    JobRunStatus:
      type: string
      enum:
        - UNKNOWN_JOB_RUN_STATUS
        - QUEUED
        - PROCESSING
        - COMPLETE
        - FAILED
        - PARTIALLY_FAILED
        - THRESHOLD_WARNING
        - NO_NEW_USERS

    JobRunType:
      type: string
      enum:
        - UNKNOWN_JOB_RUN_TYPE
        - FULL_REFRESH
        - INCREMENTAL

    JobDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        jobDetailParameters:
          type: array
          items:
            $ref: '#/components/schemas/JobDetailParameter'

    JobDetailParameter:
      type: object
      properties:
        label:
          type: string
        value:
          type: string


    DataExportJobs:
      type: array
      items:
        $ref: '#/components/schemas/DataExportJob'

    DataExportJob:
      type: object
      properties:
        ID:
          type: string
        name:
          type: string
        organizationID:
          type: string
        dataExportJobType:
          type: string
        status:
          $ref: '#/components/schemas/DataOutJobStatus'
        partnerAccount:
          $ref: '#/components/schemas/PartnerAccount'
        jobType:
          $ref: '#/components/schemas/PicanmixType'
        timeAudit:
          $ref: '#/components/schemas/TimeAudit'
        userAudit:
          $ref: '#/components/schemas/UserAudit'
        questionID:
          type: string
        questionName:
          type: string
        questionDisplayName:
          type: string
        jobLastRunTime:
          type: string
          format: date-time
        partnerAccountCrChannelStatus:
          type: string

    PartnerAccount:
      type: object
      properties:
        ID:
          type: string
        name:
          type: string
        organizationID:
          type: string
        partner:
