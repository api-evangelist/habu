      operationId: listCleanroomDestinations
      description: >-
        Lists destinations provisioned to this cleanroom. Each item includes the partner account, whether the org is owner or partner, and the activation channel status.
        Paginate with limit and offset (defaults 30 and 0; limit may not exceed 100). You can optionally filter by partner type.
      parameters:
        - name: cleanroomId
          in: path
          description: Identifier of the cleanroom.
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: When provided, only destinations whose partner has this type (for example EXPORTS) are returned.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Number of destinations to return. Default 30; must be between 1 and 100.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 30
        - name: offset
          in: query
          description: Number destinations to skip at the start of the list. Default is 0.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: latestJobDays
          in: query
          description: When set, job run status summaries on each partner account only include runs from the last N days.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Cleanroom destinations fetched successfully.
          content:
