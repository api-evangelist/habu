openapi: 3.2.0
info:
  version: v1.0.0
  title: External APIs for Customer Integration Health API
  description: APIs to create and fetch Clean Room and related details from LiveRamp (previously Habu) for Customer Integration.
  contact:
    name: LiveRamp (previously Habu)
    url: https://liveramp.com/
    email: platform_admin@habu.com
servers:
- description: External APIs for Customer Integration
  url: https://api.habu.com/v1/
security:
- application: []
tags:
- name: Health
paths:
  /health:
    get:
      summary: Check API availability
      operationId: getHealth
      description: Returns the health status of the API. Unauthenticated — use this to verify connectivity before making authenticated calls.
      security: []
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      tags:
      - Health
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        statusCode:
          type: integer
        description:
          type: string
        version:
          type: string
  securitySchemes:
    application:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.habu.com/v1/oauth/token
          scopes: {}
