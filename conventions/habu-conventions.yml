api_style: REST over HTTPS; JSON request/response (application/xml is also declared on every operation).
authentication:
  scheme: OAuth 2.0 client credentials → bearer token
  token_endpoint: https://api.habu.com/v1/oauth/token
  token_request: 'POST with Content-Type: application/x-www-form-urlencoded, body grant_type=client_credentials,
    and Authorization: Basic base64(client_id:client_secret)'
  token_response_fields:
  - accessToken
  - tokenType
  - expiresIn
  - expiresAt
  token_lifetime_seconds: 43200
  call_header: 'Authorization: Bearer <accessToken>'
  docs: https://developers.liveramp.com/clean-room-api/reference/request-an-access-token
  detail: authentication/habu-authentication.yml
idempotency:
  supported: false
  mechanism: null
  evidence: No Idempotency-Key (or equivalent) parameter appears on any of the 151 operations in the OpenAPI,
    and the documentation does not describe a replay-safe retry mechanism.
  consequence: A retried POST — for example createCleanroomQuestionRun — can create a duplicate run. Because
    run creation is also the rate-limited operation (20/hour), a blind retry both duplicates work and
    consumes budget.
  note: Recorded as an honest absence. No Idempotency pointer is emitted in apis.yml for this provider.
