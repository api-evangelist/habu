    offset: zero-based row offset (query parameter, 11 operations)
  coverage: Only 11 of 151 operations accept limit/offset; most list operations return the full collection
    unpaginated.
  response_fields: No envelope — list operations return a bare JSON array or a typed list object; there
    is no has_more/next-cursor field.
field_expansion:
